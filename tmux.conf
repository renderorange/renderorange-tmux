# Modern tmux config - light theme

# Escape immediately — default 500ms eats keystrokes
set -g escape-time 0

# Start window/pane numbering at 1
#set -g base-index 1
#set -g pane-base-index 1
set -g renumber-windows on

# Scrollback history
set -g history-limit 50000

# Status bar
set -g status-style fg=colour236
set -g status-interval 5
set -g status-position bottom
#set -g status-position top
set -g status-justify left

# Left side: session name
set -g status-left-length 30
set -g status-left '#[fg=colour236]  #H:#S '

# Right side: memory, cpu, date, time (hidden when narrow)
set -g status-right-length 80
set -g status-right '#(tmux-status-right)'

# Window status
set -g window-status-format '#(tmux-status-window-format)'
set -g window-status-current-format '#(tmux-status-current-window-format)'
set -g window-status-separator ''
set -g window-status-activity-style none

# Pane borders
set -g pane-border-style fg=colour250
set -g pane-active-border-style fg=colour252

# Message style
set -g message-style bg=colour252,fg=colour236

# Enable truecolor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -g focus-events on

# mouse mode scroll
set -g mouse on

# screen-like prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# screen-like keybindings
bind A command-prompt "rename-window '%%'"
bind S split-window -v
bind | split-window -h
bind k confirm-before -p "Kill window? (y/n)" kill-window

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# tmux plugins (added by tmux-ws install)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
